<main style="max-width: 720px; width: 100%; margin: 0 auto; box-sizing: border-box; padding: 24px 32px 80px; flex-grow: 1; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Noto Serif JP', serif; font-weight: 400; font-size: 24px; letter-spacing: 0.2em">Contact</h1>
<p style="margin: 0; font-size: 14px; line-height: 2; color: #c9c7bf">展示・制作のご依頼、取材などのお問い合わせは、以下のフォームからお送りください。</p>
</div>
<form style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="c-name" style="font-size: 12px; letter-spacing: 0.1em; color: #a3a29c">お名前 Name</label>
<input id="c-name" type="text" style="min-height: 48px; padding: 0 14px; background: #1b1b19; border: 1px solid #3a3a36; color: #e8e6df; font: inherit; font-size: 15px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="c-mail" style="font-size: 12px; letter-spacing: 0.1em; color: #a3a29c">メールアドレス Email</label>
<input id="c-mail" type="email" style="min-height: 48px; padding: 0 14px; background: #1b1b19; border: 1px solid #3a3a36; color: #e8e6df; font: inherit; font-size: 15px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="c-body" style="font-size: 12px; letter-spacing: 0.1em; color: #a3a29c">内容 Message</label>
<textarea id="c-body" rows="8" style="padding: 14px; background: #1b1b19; border: 1px solid #3a3a36; color: #e8e6df; font: inherit; font-size: 15px; line-height: 1.8; resize: vertical"></textarea>
</div>
<button type="button" style="align-self: flex-start; min-height: 48px; padding: 0 40px; background: #e8e6df; color: #121211; border: 0; font: inherit; font-size: 14px; letter-spacing: 0.2em; cursor: pointer">送信する</button>
</form>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; border-top: 1px solid #33332f; padding-top: 24px; color: #a3a29c">
