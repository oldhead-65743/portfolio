    <div class="contact-intro">
      <h1 class="page-title">Contact</h1>
      <p>お問い合わせフォームは現在準備中です。ご連絡は当面 Instagram のメッセージよりお願いいたします。</p>
    </div>

    <!--
      TODO: 送信先が未確定です。Formspree 等に接続する場合は、
      1) 下の <form> に action="https://formspree.io/f/xxxxxxxx" method="POST" を設定し、
      2) 送信ボタンを type="button" から type="submit" に変更し、
      3) site.toml の [contact] maintenance を false にしてください。
    -->
    <div class="contact-form-wrap">
    <form class="contact-form is-maintenance">
      <div class="contact-field">
        <label for="c-name">お名前 Name</label>
        <input id="c-name" name="name" type="text" autocomplete="name" disabled>
      </div>
      <div class="contact-field">
        <label for="c-mail">メールアドレス Email</label>
        <input id="c-mail" name="email" type="email" autocomplete="email" disabled>
      </div>
      <div class="contact-field">
        <label for="c-body">内容 Message</label>
        <textarea id="c-body" name="message" rows="8" disabled></textarea>
      </div>
      <button type="button" class="contact-submit" disabled>送信する</button>
    </form>
      <div class="contact-cover" role="status">
        <span class="contact-cover__badge">整備中</span>
      </div>
    </div>

    <div class="contact-sns">
      <span class="contact-sns__label">Instagram</span>
      <a href="https://www.instagram.com/wakaoshun_artworks/" target="_blank" rel="noopener" aria-label="Instagram @wakaoshun_artworks（別タブで開く）">
